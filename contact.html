          </div>

          {/* PROJECT SELECTOR */}
          <div className="c-content" ref={selectorRef}>
            <div className="c-selector c-reveal">
              <h2 className="c-selector-title display">What are you looking to build?</h2>
              <div className="c-selector-grid" role="radiogroup" aria-label="Project type">
                {PROJECT_TYPES.map((item, i) => (
                  <button
                    key={item.idx}
                    className={"c-selector-item" + (selected === i ? " active" : "")}
                    onClick={() => setSelected(selected === i ? null : i)}
                    role="radio"
                    aria-checked={selected === i}
                    data-hover
                  >
                    <span className="c-selector-idx mono">{item.idx}</span>
                    <span className="c-selector-label">{item.label}</span>
                    <span className="c-selector-dot" aria-hidden="true"></span>
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* CTA */}
          <div className="c-content" ref={ctaRef}>
            <div className="c-cta c-reveal">
              <h2 className="c-cta-title display">Start a project</h2>
              <div className="c-cta-row">
                <a href={buildMailto()} className="c-cta-btn primary" data-hover>
                  <Icon name="mail" size={14} /> Start a Project <Icon name="arrow" size={14} />
                </a>
                <a href={CONTACT.github} target="_blank" rel="noopener noreferrer" className="c-cta-btn" data-hover>
                  <Icon name="github" size={14} /> GitHub
                </a>
                <a href={CONTACT.linkedin} target="_blank" rel="noopener noreferrer" className="c-cta-btn" data-hover>
                  <Icon name="linkedin" size={14} /> LinkedIn
                </a>
              </div>
            </div>
          </div>

          {/* CLOSING */}
          <div className="c-content" ref={closingRef}>
            <footer className="c-closing c-reveal">
              <div className="c-closing-text display">See you on<br/>the other side.</div>
              <div className="c-closing-name">Omar Mohamed</div>
              <div className="c-closing-role mono">Frontend Developer &mdash; AI Automation Enthusiast</div>
              <a href="index.html" className="c-closing-back" data-hover>
                <Icon name="arrowLeft" size={14} /> Back to Portfolio
              </a>
            </footer>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ContactApp />);
  </script>
</body>
</html>
