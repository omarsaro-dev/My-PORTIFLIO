    /* ================================================================
       SMOOTH SCROLL
       ================================================================ */
    function useSmoothScroll() {
      useLayoutEffect(() => {
        const isDesktop = window.matchMedia('(min-width: 861px)').matches && !('ontouchstart' in window);
        if (isDesktop) document.body.classList.add('smooth-active');
        const content = document.getElementById('smooth-content');
        let raf;
        function setHeight() { document.body.style.height = content.getBoundingClientRect().height + 'px'; }
        if (isDesktop) {
          let current = 0, target = 0;
          setHeight();
          ScrollTrigger.scrollerProxy(document.body, {
            scrollTop(value) { if (arguments.length) { current = target = value; window.scrollTo(0, value); } return current; },
            getBoundingClientRect() { return { top: 0, left: 0, width: window.innerWidth, height: window.innerHeight }; },
            pinType: "transform",
          });
          function tick() {
            target = window.scrollY;
            current += (target - current) * 0.085;
            if (Math.abs(target - current) < 0.05) current = target;
            gsap.set(content, { y: -current });
            ScrollTrigger.update();
            raf = requestAnimationFrame(tick);
          }
          raf = requestAnimationFrame(tick);
          const onResize = () => { setHeight(); ScrollTrigger.refresh(); };
          window.addEventListener('resize', onResize);
          const t = setTimeout(() => { setHeight(); ScrollTrigger.refresh(); }, 400);
          return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); clearTimeout(t); };
        } else {
          const t = setTimeout(() => ScrollTrigger.refresh(), 400);
          return () => clearTimeout(t);
        }
      }, []);
    }

    /* ================================================================
       THREE.JS DIGITAL UNIVERSE
       ================================================================ */
    let webglState = { chapter: 0, mouse: { x: 0, y: 0 }, scroll: 0 };

    function initWebGL() {
      const canvas = document.getElementById('webgl-canvas');
      if (!canvas || typeof THREE === 'undefined') return;
      const isMobile = window.innerWidth < 860;
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion || isMobile) { canvas.style.display = 'none'; return; }

      let renderer, scene, camera, particles, ico, ring, lines, raf;
      let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
      let scrollNorm = 0;

      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, alpha: true, powerPreference: 'low-power' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
        renderer.setClearColor(0x050505, 1);

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.0005);
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 500);

        /* Particles */
        const count = isMobile ? 2000 : 5000;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const origPos = new Float32Array(count * 3);
        const vel = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const r = 200 + Math.random() * 600;
          pos[i3] = r * Math.sin(phi) * Math.cos(theta);
          pos[i3+1] = r * Math.sin(phi) * Math.sin(theta);
          pos[i3+2] = r * Math.cos(phi);
          origPos[i3] = pos[i3]; origPos[i3+1] = pos[i3+1]; origPos[i3+2] = pos[i3+2];
          vel[i3] = (Math.random()-0.5)*0.2; vel[i3+1] = (Math.random()-0.5)*0.2; vel[i3+2] = (Math.random()-0.5)*0.2;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ color: 0xff4d00, size: isMobile ? 1.6 : 1.0, transparent: true, opacity: 0.35, sizeAttenuation: true });
        particles = new THREE.Points(geo, mat);
        scene.add(particles);

        /* Central icosahedron */
        const icoGeo = new THREE.IcosahedronGeometry(isMobile ? 35 : 55, 1);
        const icoMat = new THREE.MeshBasicMaterial({ color: 0xff4d00, wireframe: true, transparent: true, opacity: 0.12 });
        ico = new THREE.Mesh(icoGeo, icoMat);
        scene.add(ico);

        /* Ring */
        const ringGeo = new THREE.TorusGeometry(isMobile ? 50 : 75, 0.4, 8, 80);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.06 });
        ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI * 0.35;
        scene.add(ring);

        /* Connecting lines between nearby particles (subset) */
        const lineCount = isMobile ? 40 : 120;
        const lineGeo = new THREE.BufferGeometry();
        const linePos = new Float32Array(lineCount * 6);
        lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
        const lineMat = new THREE.LineBasicMaterial({ color: 0xff4d00, transparent: true, opacity: 0.06 });
        lines = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lines);

        /* Mouse */
        const onMouse = (e) => { targetMouseX = (e.clientX/window.innerWidth-0.5)*2; targetMouseY = (e.clientY/window.innerHeight-0.5)*2; };
        window.addEventListener('mousemove', onMouse);
        const onScroll = () => { scrollNorm = window.scrollY / (document.body.scrollHeight - window.innerHeight || 1); };
        window.addEventListener('scroll', onScroll, { passive: true });

        let visible = true;
        const onVis = () => { visible = !document.hidden; };
        document.addEventListener('visibilitychange', onVis);

        let time = 0;
        function animate() {
          raf = requestAnimationFrame(animate);
          if (!visible) return;
          time += 0.004;
          mouseX += (targetMouseX - mouseX) * 0.03;
          mouseY += (targetMouseY - mouseY) * 0.03;

          /* Particle drift */
          const p = particles.geometry.attributes.position.array;
          for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            p[i3] += vel[i3]; p[i3+1] += vel[i3+1]; p[i3+2] += vel[i3+2];
            if (Math.abs(p[i3]) > 900) vel[i3] *= -1;
            if (Math.abs(p[i3+1]) > 900) vel[i3+1] *= -1;
            if (Math.abs(p[i3+2]) > 900) vel[i3+2] *= -1;
          }
          particles.geometry.attributes.position.needsUpdate = true;

          /* Lines — connect nearby particles */
          const lp = lines.geometry.attributes.position.array;
          let li = 0;
          for (let i = 0; i < Math.min(count, 200) && li < lineCount * 6; i += Math.max(1, Math.floor(count/200))) {
            for (let j = i + Math.max(1, Math.floor(count/200)); j < Math.min(count, 200) && li < lineCount * 6; j += Math.max(1, Math.floor(count/200))) {
              const dx = p[i*3]-p[j*3], dy = p[i*3+1]-p[j*3+1], dz = p[i*3+2]-p[j*3+2];
              const dist = dx*dx+dy*dy+dz*dz;
              if (dist < 15000) {
                lp[li]=p[i*3]; lp[li+1]=p[i*3+1]; lp[li+2]=p[i*3+2];
                lp[li+3]=p[j*3]; lp[li+4]=p[j*3+1]; lp[li+5]=p[j*3+2];
                li += 6;
              }
            }
          }
          lines.geometry.attributes.position.needsUpdate = true;

          /* Particles react to mouse */
          particles.rotation.y += (mouseX * 0.06 - particles.rotation.y) * 0.008;
          particles.rotation.x += (mouseY * 0.04 - particles.rotation.x) * 0.008;

          /* Central object */
          ico.rotation.x = time * 0.35 + mouseY * 0.25;
          ico.rotation.y = time * 0.25 + mouseX * 0.25;
          ico.scale.setScalar(1 + Math.sin(time * 2) * 0.04);

          ring.rotation.z = time * 0.15;
          ring.rotation.y = mouseX * 0.15;

          /* Camera — scroll drives depth */
          camera.position.z = 500 - scrollNorm * 250;
          camera.position.y = -scrollNorm * 80 + mouseY * 15;
          camera.position.x = mouseX * 20;

          /* Chapter-based color shifts */
          const ch = webglState.chapter;
          let targetR = 1, targetG = 0.3, targetB = 0;
          if (ch >= 7 && ch <= 8) { targetR = 0.54; targetG = 0.36; targetB = 0.96; } /* violet for machine/lab */
          mat.color.r += (targetR - mat.color.r) * 0.01;
          mat.color.g += (targetG - mat.color.g) * 0.01;
          mat.color.b += (targetB - mat.color.b) * 0.01;
          icoMat.color.copy(mat.color);

          renderer.render(scene, camera);
        }
        animate();

        const onResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', onResize);
        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('mousemove', onMouse);
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('resize', onResize);
          document.removeEventListener('visibilitychange', onVis);
          renderer.dispose(); geo.dispose(); mat.dispose(); icoGeo.dispose(); icoMat.dispose();
          ringGeo.dispose(); ringMat.dispose(); lineGeo.dispose(); lineMat.dispose();
        };
      } catch(e) { canvas.style.display = 'none'; }
    }

       ================================================================ */
    function TheVoid({ onComplete }) {
      const [nameShow, setNameShow] = useState(false);
      const [subShow, setSubShow] = useState(false);
      const [counterShow, setCounterShow] = useState(false);
      const [lineShow, setLineShow] = useState(false);
      const [counter, setCounter] = useState('00.0');
      const [progress, setProgress] = useState(0);
      const [done, setDone] = useState(false);

      useEffect(() => {
        const t1 = setTimeout(() => setNameShow(true), 300);
        const t2 = setTimeout(() => setSubShow(true), 900);
        const t3 = setTimeout(() => { setCounterShow(true); setLineShow(true); }, 1300);

        let current = 0;
        const interval = setInterval(() => {
          current += Math.random() * 1.2 + 0.3;
          if (current >= 8.2) {
            current = 8.2;
            clearInterval(interval);
            setTimeout(() => setDone(true), 600);
            setTimeout(() => onComplete(), 1800);
          }
          setCounter(current.toFixed(1));
          setProgress(Math.min(100, (current / 8.2) * 100));
        }, 50);

        const hardTimeout = setTimeout(() => {
          clearInterval(interval);
          setCounter('8.2');
          setProgress(100);
          setDone(true);
          setTimeout(() => onComplete(), 300);
        }, 4000);

        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearInterval(interval); clearTimeout(hardTimeout); };
      }, []);

      return (
        <div className={`void ${done ? 'done' : ''}`} aria-hidden="true">
          <div className={`void-name ${nameShow ? 'show' : ''}`}>OMAR</div>
          <div className={`void-sub ${subShow ? 'show' : ''}`}>Initializing Experience</div>

          (s.connections || []).forEach(j => {
            if (j > i) conns.push({ from: i, to: j });
          });
        });
        return conns;
      }, []);

      const isHighlighted = (conn) => {
        if (hovered === null) return false;
        return conn.from === hovered || conn.to === hovered;
      };

      return (
        <section className="system" id="system" aria-label="Skills System">
          <div className="system-head">
            <div className="about-eyebrow mono reveal" style={{ color: "var(--orange)" }}>05 — System</div>

                {connections.map((conn, i) => (
                  <line key={i} className={`constellation-line ${isHighlighted(conn) ? 'highlighted' : ''}`}
                    x1={SKILLS[conn.from].x} y1={SKILLS[conn.from].y}
                    x2={SKILLS[conn.to].x} y2={SKILLS[conn.to].y} />
                ))}
              </svg>
              <div className="constellation-canvas">
                {SKILLS.map((s, i) => (
                  <div key={s.name} className="skill-node" style={{ left: s.x + '%', top: s.y + '%' }}
                    onMouseEnter={() => setHovered(i)} onMouseLeave={() => setHovered(null)} data-hover>
                    <div className="skill-node-dot"></div>
                    <div className="skill-node-name">{s.name}</div>
                    <div className={`skill-node-status ${s.status}`}>{s.status}</div>

                  const src = typeof img === 'string' ? img : img.src;
                  const caption = typeof img === 'object' ? img.caption : null;
                  const featured = typeof img === 'object' && img.featured;
                  const alt = typeof img === 'object' && img.caption

                  return (

        <nav className={`quick-access ${visible ? 'visible' : ''}`} aria-label="Quick navigation">
          {items.map(item => (
            <button key={item.id} className={"quick-access-item mono" + (active === item.activeId ? " active" : "")} onClick={() => jumpTo(item.id)} data-hover>{item.label}</button>
          ))}
        </nav>
      );
    }

    /* ================================================================
       STICKY EXPLORE CTA
       ================================================================ */
    function ExploreWork({ lang }) {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          const heroEnd = document.getElementById('hero');
          if (heroEnd) {
            const rect = heroEnd.getBoundingClientRect();
            setVisible(rect.bottom < 0);
          }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      const t = LANG[lang];
      const jump = () => {
        const el = document.getElementById('worlds');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };
      return (
        <button className={`explore-work mono ${visible ? 'visible' : ''}`} onClick={jump} data-hover aria-label="Explore my work">
          <span>{t.work} ↓</span>
        </button>
      );
    }

    /* ================================================================
       SERVICES
       ================================================================ */
    function Services() {
      const ref = useRef(null);
      const [hovered, setHovered] = useState(null);
      useEffect(() => {
        if (window.innerWidth < 860) return;
        const items = ref.current.querySelectorAll('.service-item');
        items.forEach((el, i) => {
          gsap.from(el, { opacity: 0, y: 40, duration: 0.8, ease: "power3.out", delay: i * 0.08,
            scrollTrigger: { trigger: el, start: "top 88%", toggleActions: "play none none reverse" }
          });
        });
      }, []);
      return (
        <section className="services" id="services" ref={ref} aria-label="Services">
          <div className="services-head">
            <div className="about-eyebrow mono reveal" style={{ color: "var(--orange)" }}>Capabilities</div>
            <h2 className="display reveal">Services</h2>
          </div>
          <div className="services-list">
            {SERVICES.map((s, i) => (
              <div key={s.idx} className={`service-item ${hovered === i ? 'hovered' : ''}`}
                onMouseEnter={() => setHovered(i)} onMouseLeave={() => setHovered(null)} data-hover>
                <div className="service-idx mono">{s.idx} /</div>
                <div className="service-content">
                  <h3 className="service-title display">{s.title.replace('\n', ' ')}</h3>
                  <p className="service-desc">{s.desc}</p>
                  <div className={`service-status mono ${s.status}`}>{s.status}</div>
                </div>
                <div className="service-arrow"><Icon name="chevronRight" size={20} /></div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    /* ================================================================
       PROOF
       ================================================================ */
    function Proof() {
      const ref = useRef(null);
      useReveal(".reveal", ref);
      return (
        <section className="proof" id="proof" ref={ref} aria-label="Proof of Work">
          <div className="proof-head">
            <div className="about-eyebrow mono reveal" style={{ color: "var(--orange)" }}>Credibility</div>
            <h2 className="display reveal">Proof</h2>
          </div>
          <div className="proof-content">
            <div className="proof-statement reveal">
              <h3 className="display">Building In Public</h3>
              <p>Every project on this site is real. Every technology listed is hands-on. Every system shown is something I built, tested, and shipped.</p>
            </div>
            <div className="proof-grid">
              <div className="proof-card reveal" data-hover>
                <div className="proof-card-icon"><Icon name="github" size={28} /></div>
                <div className="proof-card-title mono">Open Source</div>
                <div className="proof-card-desc">Code repositories and project sources available on GitHub.</div>
                <a href="https://github.com/omarsaro-dev" target="_blank" rel="noopener noreferrer" className="proof-card-link" data-hover>View GitHub <Icon name="external" size={12} /></a>
              </div>
              <div className="proof-card reveal" data-hover>
                <div className="proof-card-icon"><Icon name="external" size={28} /></div>
                <div className="proof-card-title mono">Live Projects</div>
                <div className="proof-card-desc">Working demos and deployed projects you can explore right now.</div>
                <span className="proof-card-link mono" style={{ color: 'var(--grey-dim)' }}>See Worlds Section</span>
              </div>
              <div className="proof-card reveal" data-hover>
                <div className="proof-card-icon"><Icon name="mail" size={28} /></div>
                <div className="proof-card-title mono">Direct Contact</div>
                <div className="proof-card-desc">Real email, real phone, real response. No gatekeepers.</div>
                <a href="mailto:omarsaro2026@gmail.com" className="proof-card-link" data-hover>omarsaro2026@gmail.com <Icon name="external" size={12} /></a>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ================================================================
       CASE STUDY VIEWER
       ================================================================ */
    function CaseStudyViewer({ id, onClose, lang }) {
      const data = CASE_STUDIES[id];
      const world = WORLDS.find(w => w.links && w.links.casestudy === id);
      const nextId = id === "03" ? "01" : String(Number(id) + 1).padStart(2, '0');
      const nextWorld = WORLDS.find(w => w.links && w.links.casestudy === nextId);
      const t = LANG[lang];

      useEffect(() => {
        document.body.style.overflow = 'hidden';
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => { document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
      }, []);

      if (!data) return null;

      const sections = [
        { label: "THE PROBLEM", text: data.problem },
        { label: "MY ROLE", text: data.role },
        { label: "THE APPROACH", text: data.approach },
        { label: "THE SOLUTION", text: data.solution },
        { label: "TECHNOLOGY", items: data.technology },
        { label: "CHALLENGES", text: data.challenges },
        { label: "DECISIONS", text: data.decisions },
        { label: "RESULT", text: data.result },
        { label: "LESSONS", text: data.lessons },
        { label: "NEXT ITERATION", text: data.next },
      ];

      return (
        <div className="case-study-overlay" role="dialog" aria-label={`Case Study: ${world ? world.title.join(' ') : ''}`} aria-modal="true">
          <div className="case-study-backdrop" onClick={onClose}></div>
          <div className="case-study-panel">
            <div className="case-study-header">
              <div>
                <div className="case-study-idx mono">{world ? world.idx : id}</div>
                <h2 className="case-study-title display">{world ? world.title.join(' ') : 'Project'}</h2>
              </div>
              <button className="case-study-close" onClick={onClose} data-hover aria-label="Close case study">
                <Icon name="close" size={20} />
              </button>
            </div>
            <div className="case-study-body">
              {sections.map((sec, i) => (
                <div key={i} className="cs-section">
                  <div className="cs-label mono">{sec.label}</div>
                  {sec.text && <p className="cs-text">{sec.text}</p>}
                  {sec.items && (
                    <div className="cs-tags">{sec.items.map(t => <span key={t} className="cs-tag">{t}</span>)}</div>
                  )}
                </div>
              ))}
            </div>
            <div className="case-study-footer">
              <button className="cta-btn" onClick={onClose} data-hover><Icon name="arrow" size={14} /> {t.backToWork}</button>
              {nextWorld && (
                <button className="cta-btn" onClick={() => { onClose(); setTimeout(() => {
                  const el = document.getElementById('worlds');
                  if (el) el.scrollIntoView({ behavior: 'smooth' });
                }, 300); }} data-hover>{t.nextProject} <Icon name="chevronRight" size={14} /></button>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ================================================================
       DEVELOPER MODE
       ================================================================ */
    function DevMode() {
      const [visible, setVisible] = useState(false);
      const [fps, setFps] = useState(0);
      const [scroll, setScroll] = useState(0);

      useEffect(() => {
        const onKey = (e) => {
          if (e.ctrlKey && e.shiftKey && e.key === 'O') {
            e.preventDefault();
            setVisible(v => !v);
          }
        };
        window.addEventListener('keydown', onKey);

        let frames = 0, lastTime = performance.now();
        const measureFps = () => {
          frames++;
          const now = performance.now();
          if (now - lastTime >= 1000) {
            setFps(frames);
            frames = 0;
            lastTime = now;
          }
          requestAnimationFrame(measureFps);
        };
        const raf = requestAnimationFrame(measureFps);

        const onScroll = () => setScroll(Math.round(window.scrollY));
        window.addEventListener('scroll', onScroll, { passive: true });

        return () => { window.removeEventListener('keydown', onKey); cancelAnimationFrame(raf); window.removeEventListener('scroll', onScroll); };
      }, []);

      if (!visible) return null;

      return (
        <div className="dev-mode visible" aria-label="Developer mode panel">
          <div className="dev-mode-title">OMAR.SYSTEM</div>
          <div className="dev-mode-row"><span>FPS</span><span className="dev-mode-val">{fps}</span></div>
          <div className="dev-mode-row"><span>WEBGL</span><span className="dev-mode-val">{typeof THREE !== 'undefined' ? 'Active' : 'N/A'}</span></div>
          <div className="dev-mode-row"><span>GSAP</span><span className="dev-mode-val">{typeof gsap !== 'undefined' ? 'Active' : 'N/A'}</span></div>
          <div className="dev-mode-row"><span>SCROLL</span><span className="dev-mode-val">{scroll}px</span></div>
          <div className="dev-mode-row"><span>VIEWPORT</span><span className="dev-mode-val">{window.innerWidth}×{window.innerHeight}</span></div>
          <div className="dev-mode-row"><span>MOTION</span><span className="dev-mode-val">{window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'Reduced' : 'Full'}</span></div>
        </div>
      );
    }

    /* ================================================================
       LANGUAGE TOGGLE
       ================================================================ */
    function LangToggle({ lang, setLang }) {
      return (
        <button className="lang-toggle" onClick={() => setLang(lang === 'en' ? 'ar' : 'en')} data-hover aria-label="Switch language">
          {lang === 'en' ? 'عربي' : 'EN'}
        </button>
      );
    }

    /* ================================================================
       APP
       ================================================================ */
    function App() {
      const [active, setActive] = useState("hero");
      const [loaded, setLoaded] = useState(false);
      const [scrollProgress, setScrollProgress] = useState(0);
      const [caseStudyId, setCaseStudyId] = useState(null);
      const [lang, setLang] = useState(() => {
        try { return localStorage.getItem('om-lang') || 'en'; } catch(e) { return 'en'; }
      });
      useSmoothScroll();

      useEffect(() => {
        try { localStorage.setItem('om-lang', lang); } catch(e) {}
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      }, [lang]);

      useEffect(() => {
        initWebGL();
      }, []);

      useEffect(() => {
        if (!loaded) return;
        if (window.innerWidth < 860) return;
        CHAPTERS.forEach(ch => {
          const el = document.getElementById(ch.id);
          if (!el) return;
          ScrollTrigger.create({
            trigger: el, start: "top center", end: "bottom center",
            onEnter: () => { setActive(ch.id); webglState.chapter = CHAPTERS.indexOf(ch); },
            onEnterBack: () => { setActive(ch.id); webglState.chapter = CHAPTERS.indexOf(ch); },
          });
        });
        const onScroll = () => {
          const max = document.body.scrollHeight - window.innerHeight;
          setScrollProgress(max > 0 ? window.scrollY / max : 0);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        const t = setTimeout(() => ScrollTrigger.refresh(), 500);
        return () => { window.removeEventListener('scroll', onScroll); clearTimeout(t); };
      }, [loaded]);

      return (
        <React.Fragment>
          {!loaded && <TheVoid onComplete={() => setLoaded(true)} />}
          <Grain />
          <Vignette />
          <CustomCursor />
          <Navigation active={active} />
          <LangToggle lang={lang} setLang={setLang} />
          <Rail active={active} />
          <ChapterProgress progress={scrollProgress} />
          <QuickAccess lang={lang} active={active} />
          <ExploreWork lang={lang} />
          <div id="smooth-wrapper">
            <div id="smooth-content">
              <Hero lang={lang} />
              <Manifesto />
              <About />
              <Services />
              <Mind />
              <Evolution />
              <System />
              <Worlds onCaseStudy={(id) => setCaseStudyId(id)} />
              <Machine />
              <Lab />
              <Proof />
              <Now />
              <Next />
              <Exit />
              <Footer />
            </div>
          </div>
          {caseStudyId && <CaseStudyViewer id={caseStudyId} onClose={() => setCaseStudyId(null)} lang={lang} />}
          <DevMode />
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
