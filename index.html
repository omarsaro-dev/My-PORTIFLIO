    /* ============================================================

    function useSmoothScrollAndIntro() {
      useLayoutEffect(() => {
        const isDesktop = window.matchMedia('(min-width: 861px)').matches && !('ontouchstart' in window);
        if (isDesktop) document.body.classList.add('smooth-active');

        const wrapper = document.getElementById('smooth-wrapper');
        const content = document.getElementById('smooth-content');
        let raf;

        function setHeight() {
          document.body.style.height = content.getBoundingClientRect().height + 'px';
        }

        if (isDesktop) {
          let current = 0, target = 0;
          setHeight();

          ScrollTrigger.scrollerProxy(document.body, {
            scrollTop(value) {
              if (arguments.length) { current = target = value; window.scrollTo(0, value); }
              return current;
            },
            getBoundingClientRect() {
              return { top: 0, left: 0, width: window.innerWidth, height: window.innerHeight };
            },
            pinType: "transform",
          });

          function tick() {
            target = window.scrollY;
            current += (target - current) * 0.085;
            if (Math.abs(target - current) < 0.05) current = target;
            gsap.set(content, { y: -current });
            ScrollTrigger.update();
            raf = requestAnimationFrame(tick);
          }
          raf = requestAnimationFrame(tick);

          const onResize = () => { setHeight(); ScrollTrigger.refresh(); };
          window.addEventListener('resize', onResize);
          const t = setTimeout(() => { setHeight(); ScrollTrigger.refresh(); }, 400);

          return () => {
            cancelAnimationFrame(raf);
            window.removeEventListener('resize', onResize);
            clearTimeout(t);
          };
        } else {
          const t = setTimeout(() => ScrollTrigger.refresh(), 400);
          return () => clearTimeout(t);
        }
      }, []);
    }

    /* ============================================================
       THREE.JS WEBGL ENVIRONMENT
       ============================================================ */
    function useWebGL() {
      useEffect(() => {
        const canvas = document.getElementById('webgl-canvas');
        if (!canvas || typeof THREE === 'undefined') return;

        let renderer, scene, camera, particles, ico, raf;
        let mouseX = 0, mouseY = 0, scrollY = 0;
        let targetMouseX = 0, targetMouseY = 0;
        const isMobile = window.innerWidth < 860;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (prefersReducedMotion) {
          canvas.style.display = 'none';
          return;
        }

        try {
          renderer = new THREE.WebGLRenderer({
            canvas, antialias: !isMobile, alpha: true,
            powerPreference: 'low-power'
          });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));

          scene = new THREE.Scene();
          scene.fog = new THREE.FogExp2(0x050505, 0.0008);

          camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
          camera.position.z = 500;

          /* Particles */
          const count = isMobile ? 1500 : 4000;
          const geo = new THREE.BufferGeometry();
          const positions = new Float32Array(count * 3);
          const velocities = new Float32Array(count * 3);
          for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 2000;
            positions[i3 + 1] = (Math.random() - 0.5) * 2000;
            positions[i3 + 2] = (Math.random() - 0.5) * 2000;
            velocities[i3] = (Math.random() - 0.5) * 0.3;
            velocities[i3 + 1] = (Math.random() - 0.5) * 0.3;
            velocities[i3 + 2] = (Math.random() - 0.5) * 0.3;
          }
          geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

          const mat = new THREE.PointsMaterial({
            color: 0xff4d00, size: isMobile ? 1.8 : 1.2,
            transparent: true, opacity: 0.4,
            sizeAttenuation: true,
          });
          particles = new THREE.Points(geo, mat);
          scene.add(particles);

          /* Central geometry */
          const icoGeo = new THREE.IcosahedronGeometry(isMobile ? 40 : 60, 1);
          const icoMat = new THREE.MeshBasicMaterial({
            color: 0xff4d00, wireframe: true, transparent: true, opacity: 0.15
          });
          ico = new THREE.Mesh(icoGeo, icoMat);
          scene.add(ico);

          /* Secondary ring */
          const ringGeo = new THREE.TorusGeometry(isMobile ? 55 : 80, 0.5, 8, 64);
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0x8b5cf6, transparent: true, opacity: 0.08
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI * 0.3;
          scene.add(ring);

          /* Mouse tracking */
          const onMouseMove = (e) => {
            targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
          };
          window.addEventListener('mousemove', onMouseMove);

          /* Scroll tracking */
          const onScroll = () => { scrollY = window.scrollY; };
          window.addEventListener('scroll', onScroll, { passive: true });

          /* Visibility */
          let visible = true;
          const onVisibility = () => { visible = !document.hidden; };
          document.addEventListener('visibilitychange', onVisibility);

          /* Animation */
          let time = 0;
          function animate() {
            raf = requestAnimationFrame(animate);
            if (!visible) return;
            time += 0.005;

            mouseX += (targetMouseX - mouseX) * 0.03;
            mouseY += (targetMouseY - mouseY) * 0.03;

            /* Particles drift */
            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < count; i++) {
              const i3 = i * 3;
              pos[i3] += velocities[i3];
              pos[i3 + 1] += velocities[i3 + 1];
              pos[i3 + 2] += velocities[i3 + 2];
              if (Math.abs(pos[i3]) > 1000) velocities[i3] *= -1;
              if (Math.abs(pos[i3 + 1]) > 1000) velocities[i3 + 1] *= -1;
              if (Math.abs(pos[i3 + 2]) > 1000) velocities[i3 + 2] *= -1;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            /* Particles react to mouse */
            particles.rotation.y += (mouseX * 0.08 - particles.rotation.y) * 0.01;
            particles.rotation.x += (mouseY * 0.05 - particles.rotation.x) * 0.01;

            /* Central object */
            ico.rotation.x = time * 0.4 + mouseY * 0.3;
            ico.rotation.y = time * 0.3 + mouseX * 0.3;
            ico.scale.setScalar(1 + Math.sin(time * 2) * 0.05);

            ring.rotation.z = time * 0.2;
            ring.rotation.y = mouseX * 0.2;

            /* Camera responds to scroll */
            const scrollNorm = scrollY / (document.body.scrollHeight - window.innerHeight || 1);
            camera.position.z = 500 - scrollNorm * 200;
            camera.position.y = -scrollNorm * 100;

            renderer.render(scene, camera);
          }
          animate();

          /* Resize */
          const onResize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          };
          window.addEventListener('resize', onResize);

          return () => {
            cancelAnimationFrame(raf);
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('scroll', onScroll);
            window.removeEventListener('resize', onResize);
            document.removeEventListener('visibilitychange', onVisibility);
            renderer.dispose();
            geo.dispose();
            mat.dispose();
            icoGeo.dispose();
            icoMat.dispose();
            ringGeo.dispose();
            ringMat.dispose();
          };
        } catch (e) {
          canvas.style.display = 'none';
        }
      }, []);
    }

    /* ============================================================
       LOADING SCREEN
       ============================================================ */
    function Loader({ onComplete }) {
      const [lines, setLines] = useState([]);
      const [percent, setPercent] = useState(0);
      const [showPercent, setShowPercent] = useState(false);
      const [done, setDone] = useState(false);

      useEffect(() => {
        const sequence = [
          { text: "> INITIALIZING OMAR.EXE", delay: 200 },
          { text: "> LOADING DIGITAL ENVIRONMENT...", delay: 600 },
          { text: "> MOUNTING COMPONENTS", delay: 400 },
          { text: "> ESTABLISHING CONNECTION", delay: 350 },
        ];

        let timeouts = [];
        sequence.forEach((item, i) => {
          timeouts.push(setTimeout(() => {
            setLines(prev => [...prev, item.text]);
          }, item.delay + i * 300));
        });

        /* Percentage counter */
        timeouts.push(setTimeout(() => setShowPercent(true), 1400));
        let current = 0;
        const interval = setInterval(() => {
          current += Math.random() * 12 + 3;
          if (current >= 100) {
            current = 100;
            clearInterval(interval);
            timeouts.push(setTimeout(() => {
              setDone(true);
              timeouts.push(setTimeout(() => onComplete(), 800));
            }, 400));
          }
          setPercent(Math.floor(current));
        }, 80);

        return () => {
          timeouts.forEach(clearTimeout);
          clearInterval(interval);
        };
      }, []);

      return (
        <div className={`loader ${done ? 'done' : ''}`} aria-hidden="true">
          <div className="loader-terminal">
            {lines.map((line, i) => (
              <div key={i} className={`line ${true ? 'visible' : ''}`}>
                {line}
                {i === lines.length - 1 && <span className="cursor-blink"></span>}
              </div>
            ))}
          </div>
          {showPercent && (
            <div className={`loader-percent ${true ? 'visible' : ''}`}>
              {String(percent).padStart(3, '0')}%
            </div>
          )}
          <div className={`loader-bar ${showPercent ? 'visible' : ''}`}>
            <div className="loader-bar-fill" style={{ width: percent + '%' }}></div>
          </div>
        </div>
      );
    }

    /* ============================================================
       CURTAIN INTRO (after loader)
       ============================================================ */
    function Curtain() {
      const leftRef = useRef(null);
      const rightRef = useRef(null);
      const markRef = useRef(null);

      useEffect(() => {
        const tl = gsap.timeline({ delay: 0.15 });
        tl.to(markRef.current, { opacity: 0, duration: 0.4, delay: 0.5 })
          .to([leftRef.current, rightRef.current], {
            scaleX: 0, duration: 1.1, ease: "power4.inOut"
          }, "-=0.1")
          .set([leftRef.current, rightRef.current], { display: "none" });
        return () => tl.kill();
      }, []);

      return (
        <div className="curtain" aria-hidden="true">
          <div className="curtain-panel" ref={leftRef} style={{ transformOrigin: "left" }}></div>
          <div className="curtain-panel" ref={rightRef} style={{ transformOrigin: "right" }}></div>
          <div className="curtain-mark mono" ref={markRef}>Omar Mohamed</div>
        </div>
      );
    }

    /* ============================================================
       CUSTOM CURSOR
       ============================================================ */
    function CustomCursor() {
      const dotRef = useRef(null);
      const ringRef = useRef(null);
      const glowRef = useRef(null);

      useEffect(() => {
        if (!window.matchMedia('(min-width: 861px)').matches) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const dotX = gsap.quickTo(dotRef.current, "x", { duration: 0.08, ease: "power3" });
        const dotY = gsap.quickTo(dotRef.current, "y", { duration: 0.08, ease: "power3" });
        const ringX = gsap.quickTo(ringRef.current, "x", { duration: 0.45, ease: "power3" });
        const ringY = gsap.quickTo(ringRef.current, "y", { duration: 0.45, ease: "power3" });
        const glowX = gsap.quickTo(glowRef.current, "x", { duration: 0.7, ease: "power3" });
        const glowY = gsap.quickTo(glowRef.current, "y", { duration: 0.7, ease: "power3" });

        const move = (e) => {
          dotX(e.clientX); dotY(e.clientY);
          ringX(e.clientX); ringY(e.clientY);
          glowX(e.clientX); glowY(e.clientY);
        };
        window.addEventListener('mousemove', move);

        const onEnter = () => ringRef.current.classList.add('hover');
        const onLeave = () => ringRef.current.classList.remove('hover');

        const attach = () => {
          document.querySelectorAll('[data-hover]').forEach(el => {
            el.removeEventListener('mouseenter', onEnter);
            el.removeEventListener('mouseleave', onLeave);
            el.addEventListener('mouseenter', onEnter);
            el.addEventListener('mouseleave', onLeave);
          });
        };
        attach();
        const interval = setInterval(attach, 2000);

        return () => {
          window.removeEventListener('mousemove', move);
          clearInterval(interval);
        };
      }, []);

      return (
        <React.Fragment>
          <div className="cursor-glow" ref={glowRef} aria-hidden="true"></div>
          <div className="cursor-ring" ref={ringRef} aria-hidden="true"></div>
          <div className="cursor-dot" ref={dotRef} aria-hidden="true"></div>
        </React.Fragment>
      );
    }

    /* ============================================================
       MAGNETIC WRAPPER
       ============================================================ */
    function Magnetic({ children, strength = 0.4, className = "" }) {
      const ref = useRef(null);

      useEffect(() => {
        const el = ref.current;
        if (!el || !window.matchMedia('(min-width: 861px)').matches) return;

        const moveX = gsap.quickTo(el, "x", { duration: 0.5, ease: "power3" });
        const moveY = gsap.quickTo(el, "y", { duration: 0.5, ease: "power3" });

        const onMove = (e) => {
          const rect = el.getBoundingClientRect();
          const relX = e.clientX - (rect.left + rect.width / 2);
          const relY = e.clientY - (rect.top + rect.height / 2);
          moveX(relX * strength);
          moveY(relY * strength);
        };
        const onLeave = () => { moveX(0); moveY(0); };

        el.addEventListener('mousemove', onMove);
        el.addEventListener('mouseleave', onLeave);
        return () => {
          el.removeEventListener('mousemove', onMove);
          el.removeEventListener('mouseleave', onLeave);
        };
      }, [strength]);

      return <span className={"magnetic-wrap " + className} ref={ref} data-hover>{children}</span>;
    }

      const heroRef = useRef(null);

      useEffect(() => {
        const tl = gsap.timeline({ defaults: { ease: "power4.out" }, delay: 1.35 });
        tl.to(".hero-eyebrow", { opacity: 1, y: 0, duration: 0.8 }, 0)
          .to(".hero-name .char", { opacity: 1, filter: "blur(0px)", y: 0, duration: 1.1, stagger: 0.028 }, 0.15)
          .to(".hero-role", { opacity: 1, duration: 0.9 }, 1.0)
          .to(".scroll-cue", { opacity: 1, duration: 0.9 }, 1.2);

        gsap.to(imgwrapRef.current, {
          scale: 1.18, yPercent: 8, ease: "none",
          scrollTrigger: { trigger: heroRef.current, start: "top top", end: "bottom top", scrub: true }
        });

        if (!window.matchMedia('(min-width: 860px)').matches) return;

        const rotX = gsap.quickTo(imgwrapRef.current, "rotationX", { duration: 0.6, ease: "power3" });
        const rotY = gsap.quickTo(imgwrapRef.current, "rotationY", { duration: 0.6, ease: "power3" });

        const onMove = (e) => {
          const rect = heroRef.current.getBoundingClientRect();
          if (e.clientY < rect.top || e.clientY > rect.bottom) return;
          const px = (e.clientX - rect.left) / rect.width;
          const py = (e.clientY - rect.top) / rect.height;
          rotY((px - 0.5) * 6);
          rotX((0.5 - py) * 4);
          spotlightRef.current.style.setProperty('--sx', (px * 100) + '%');
          spotlightRef.current.style.setProperty('--sy', (py * 100) + '%');
        };
        window.addEventListener('mousemove', onMove);
        return () => window.removeEventListener('mousemove', onMove);
      }, []);

      return (
        <section className="hero" id="hero" ref={heroRef} aria-label="Hero">
          <div className="hero-imagewrap" ref={imgwrapRef}>
            <div className="hero-image-base"></div>
            <div className="hero-image-bright spotlight-mask" ref={spotlightRef}></div>

      useEffect(() => {

        gsap.set(lines, { y: 30 });
        gsap.timeline({
          scrollTrigger: { trigger: ref.current, start: "top 70%", toggleActions: "play none none reverse" }
        }).to(lines, {
          opacity: (i, el) => el.classList.contains('accent') ? 1 : 0.15,
          y: 0, duration: 0.9, stagger: 0.12, ease: "power3.out"
        });

        /* Floating keywords */
        kwRefs.current.forEach((el, i) => {
          if (!el) return;
          gsap.to(el, {
            opacity: 0.35, duration: 1.5, delay: 0.3 + i * 0.1,
            scrollTrigger: { trigger: ref.current, start: "top 80%", toggleActions: "play none none reverse" }
          });
          gsap.to(el, {
            y: () => (Math.random() - 0.5) * 20,
            x: () => (Math.random() - 0.5) * 15,
            duration: 3 + Math.random() * 2,
            repeat: -1, yoyo: true, ease: "sine.inOut",
            delay: i * 0.3
          });
        });

        /* Mouse parallax on keywords */
        const onMove = (e) => {
          const cx = (e.clientX / window.innerWidth - 0.5) * 2;
          const cy = (e.clientY / window.innerHeight - 0.5) * 2;
          kwRefs.current.forEach((el, i) => {
            if (!el) return;
            const depth = 0.5 + (i % 3) * 0.3;
            gsap.to(el, { x: cx * 20 * depth, y: cy * 15 * depth, duration: 1, ease: "power2.out" });
          });
        };
        window.addEventListener('mousemove', onMove);
        return () => window.removeEventListener('mousemove', onMove);
      }, []);

      return (
        <section className="manifesto" id="manifesto" ref={ref} aria-label="Manifesto">

          <div className="philosophy-statements">
            {MINDSET_LINES.map((line, i) => {
              const parts = line.split(/(\b\w+\.)/);
              return (
                <p
                  key={i}
                  className="philosophy-statement"
                  ref={el => statementsRef.current[i] = el}
                  style={{ opacity: 0, transform: 'translateY(20px)' }}
                >{parts.map((part, j) => part.match(/\w+\.$/) ? <em key={j}>{part}</em> : part)}</p>
              );
            })}
          </div>
        </section>
      );
    }

    function Mindset() {
      const ref = useRef(null);

        const lines = ref.current.querySelectorAll('.mindset-line');
        lines.forEach((el, i) => {
          gsap.to(el, {
            opacity: 1, color: '#F5F5F5', duration: 0.6,
            scrollTrigger: { trigger: el, start: "top 85%", toggleActions: "play none none reverse" }
          });

      }, []);
      return (
        <section className="mindset" ref={ref} aria-label="Mindset">
          <div className="mindset-grid">
            {MINDSET_LINES.map((line, i) => (
              <div key={i} className="mindset-line" style={{ opacity: 0.15 }}>{line}</div>

      );
    }

    /* ============================================================
       APP
       ============================================================ */
    function App() {
      const [active, setActive] = useState("hero");
      const [loaded, setLoaded] = useState(false);
      useSmoothScrollAndIntro();
      useWebGL();

      useEffect(() => {
        SCENES.forEach(s => {
          const el = document.getElementById(s.id);
          if (!el) return;
          ScrollTrigger.create({
            trigger: el, start: "top center", end: "bottom center",
            onEnter: () => setActive(s.id),
            onEnterBack: () => setActive(s.id),
          });
        });
        const t = setTimeout(() => ScrollTrigger.refresh(), 500);
        return () => clearTimeout(t);
      }, [loaded]);

      return (
        <React.Fragment>
          {!loaded && <Loader onComplete={() => setLoaded(true)} />}
          {loaded && <Curtain />}
          <Grain />
          <Vignette />
          <CustomCursor />
          <Nav />
          <Rail active={active} />
          <div id="smooth-wrapper">
            <div id="smooth-content">
              <Hero />
              <Manifesto />
              <About />
              <Journey />
              <Work />
              <Skills />
              <AIWorld />
              <Experiments />
              <Now />
              <Philosophy />
              <Mindset />
              <Future />
              <Contact />
              <Footer />
            </div>
          </div>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
